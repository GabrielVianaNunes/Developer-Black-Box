[package]
name = "bb-app"
version.workspace = true
edition.workspace = true
license-file = "../LICENSE"
publish.workspace = true

[features]
# Só para verificação manual: grava em disco o texto real dos itens do menu da bandeja.
e2e = ["bb-update/e2e"]

[lib]
name = "bb_app_lib"

[[bin]]
name = "developer-blackbox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
bb-tray = { path = "../crates/bb-tray" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde.workspace = true
bb-core = { path = "../crates/bb-core" }
bb-collector = { path = "../crates/bb-collector" }
bb-recorder = { path = "../crates/bb-recorder" }
bb-store = { path = "../crates/bb-store" }
bb-engine = { path = "../crates/bb-engine" }
bb-query = { path = "../crates/bb-query" }
bb-tray = { path = "../crates/bb-tray" }
bb-update = { path = "../crates/bb-update" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = ["Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_System_Com"]

[dev-dependencies]
tempfile = "3"
