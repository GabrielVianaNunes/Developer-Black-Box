[package]
name = "bb-collector"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
publish.workspace = true

[dependencies]
bb-core = { path = "../bb-core" }

[[test]]
name = "privacy_collector_windows"
path = "../../tests/privacy/collector_windows.rs"

[[test]]
name = "privacy_startup_windows"
path = "../../tests/privacy/startup_windows.rs"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
]

[[test]]
name = "privacy_apps_windows"
path = "../../tests/privacy/apps_windows.rs"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "privacy_health_fixtures"
path = "../../tests/privacy/health_fixtures.rs"
