[package]
name = "bb-update"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# Única rede do app: WinHTTP do próprio Windows (TLS do sistema). Nenhum cliente HTTP/TLS de terceiros.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = ["Win32_Networking_WinHttp"]

[[test]]
name = "privacy_network"
path = "../../tests/privacy/network.rs"

[features]
# Só para teste de ponta a ponta: aceita um servidor local sem TLS e uma chave pública de teste.
# Nunca entra em builds de release (não está em `default`; há teste que garante isso).
e2e = []

[dev-dependencies]
tempfile = "3"
