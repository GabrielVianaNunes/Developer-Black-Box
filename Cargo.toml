[workspace]
resolver = "2"
members = [
    "crates/bb-core",
    "crates/bb-recorder",
    "crates/bb-collector",
    "crates/bb-store",
    "crates/bb-query",
    "crates/bb-tray",
    "crates/bb-engine",
    "crates/bb-update",
    "src-tauri",
]

[workspace.package]
# Única fonte da versão do app (veja scripts/version.mjs).
version = "0.3.6"
edition = "2021"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
